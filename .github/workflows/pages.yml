name: Deploy WolffBot Web Flasher to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web-flasher/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-flasher/package-lock.json

      - name: Install dependencies
        working-directory: web-flasher
        run: npm ci

      - name: Build
        working-directory: web-flasher
        run: npm run build

      - name: Check that the firmware binaries made it into the build
        working-directory: web-flasher
        run: |
          set -e
          for f in manifest.json WolffBot-bootloader.bin WolffBot-partitions.bin \
                   boot_app0.bin WolffBot-app.bin WolffBot-factory.bin; do
            test -s "dist/firmware/$f" || { echo "missing dist/firmware/$f"; exit 1; }
          done
          ls -l dist/firmware

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-flasher/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
